name: Verify Runtime

on:
  push:
  pull_request:

jobs:
  verify-runtime:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate canonical and exported config samples
        run: npm run check:config

      - name: Verify generated C++ config consistency
        run: npm run check:generated-config

      - name: Run JS runtime tests
        run: npm test

      - name: Run C++ parity and generated-config tests
        run: npm run cpp:test-vectors
