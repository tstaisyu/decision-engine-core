name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install viewer dependencies
        run: npm ci --prefix viewer

      - name: Run tests
        run: npm test

      - name: Run viewer build
        run: npm run viewer:build

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check
